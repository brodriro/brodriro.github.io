{%- assign protocol = include.href | strip | slice: 0, 4 -%}
<a href="{% if protocol != 'http' %}//{% endif %}{{ include.href }}" target="_blank" rel="noopener"{% if include.class %} class="{{ include.class }}"{% endif %}{% if include.label %} aria-label="{{ include.label | escape }}" title="{{ include.label | escape }}"{% endif %}>
