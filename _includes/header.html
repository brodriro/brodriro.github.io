{%- assign home = '/' | relative_url -%}
<a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="top">
  <a class="top__name" href="{{ home }}"{% if page.layout == 'default' %} aria-current="page"{% endif %}>{{ site.name | escape }}</a>
  <nav class="top__nav" aria-label="Principal">
    <a href="{{ home }}#habilidades">Habilidades</a>
    <a href="{{ home }}#experiencia">Experiencia</a>
    <a href="{{ home }}#open-source">Open source</a>
    <a href="{{ '/blog.html' | relative_url }}"{% if page.layout == 'blog' %} aria-current="page"{% elsif page.layout == 'post' %} aria-current="true"{% endif %}>Blog</a>
  </nav>
  <a class="btn btn--small" href="mailto:{{ site.email }}">Escribirme</a>
</header>
