<section class="container section about">
  <h2 class="section-title">{{ site.about_title | default: "About Me" }}</h2>
  <div class="{% if site.about_profile_image %}split{% endif %}">
    {%- if site.about_profile_image %}
    <div class="no-print">
      <img class="profile-img" src="{{ site.about_profile_image | relative_url }}" alt="Foto de {{ site.name | escape }}" width="200" height="200">
    </div>
    {%- endif %}
    <div class="about__content">
      {{ site.about_content | strip | markdownify }}
    </div>
  </div>
</section>
