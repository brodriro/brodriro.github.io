{%- assign months = "enero,febrero,marzo,abril,mayo,junio,julio,agosto,septiembre,octubre,noviembre,diciembre" | split: "," -%}
{%- assign month_index = include.date | date: "%-m" | minus: 1 -%}
<time datetime="{{ include.date | date_to_xmlschema }}">{{ include.date | date: "%-d" }} de {{ months[month_index] }} de {{ include.date | date: "%Y" }}</time>
