---
layout: base
---
<article class="post">
  <header class="page-head">
    <div class="wrap">
      <h1>{{ page.title | escape }}</h1>
      <p class="page-head__meta">
        {%- if page.author -%}{{ page.author | escape }} · {% endif -%}
        {%- include date-es.html date=page.date -%}
      </p>
    </div>
  </header>
  <div class="wrap page-body">
    {% if page.image %}
    <img class="post__image" src="{{ page.image | relative_url }}" alt="">
    {% endif %}
    <div class="prose">
      {{ content }}
    </div>
    <p class="post__footer no-print"><a href="{{ '/blog.html' | relative_url }}">Volver al blog</a></p>
  </div>
</article>
