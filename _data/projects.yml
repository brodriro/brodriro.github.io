- name: okhttp-json-mock
  maven: https://central.sonatype.com/artifact/io.github.brodriro/okhttp-json-mock
  code: https://github.com/brodriro/okhttp-json-mock
  tech: [Kotlin, Android, OkHttp, Retrofit]
  description: >-
    Librería en Kotlin para simular respuestas de OkHttp y Retrofit con archivos JSON locales.
    Fork mantenido de mirrajabi/okhttp-json-mock, publicado en Maven Central.

- name: http_mutual_authentication
  pub: https://pub.dev/packages/http_mutual_authentication
  code: https://github.com/brodriro/HttpMutualAuthentication
  tech: [Dart, Flutter]
  description: >-
    Librería en Dart para aplicaciones Flutter: envía la información cifrada desde el dispositivo móvil
    hasta el servidor mediante una llave pública.

- name: sql_helper
  pub: https://pub.dev/packages/sql_helper
  code: https://github.com/brodriro/FlutterSQLHelper
  tech: [Dart, Flutter]
  description: >-
    Librería en Dart para aplicaciones Flutter: facilita la creación de tablas, registros y consultas
    a base de datos. Basada en sqflite.
